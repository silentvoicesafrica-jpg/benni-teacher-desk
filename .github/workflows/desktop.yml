name: Desktop app (Windows installer)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-check:
    name: Compile check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux web libraries needed by Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri build tool (pinned version)
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build installers (NSIS .exe and MSI)
        working-directory: src-tauri
        run: cargo tauri build
      - name: Save installers as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: benni-teacher-desk-windows
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
