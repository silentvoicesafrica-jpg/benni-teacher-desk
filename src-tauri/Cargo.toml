[package]
name = "benni-teacher-desk"
version = "1.0.0"
description = "Benni Teacher Assistant: a free, offline-first teacher desk for ICT teaching in Ghana."
authors = ["Eddy"]
license = "MIT"
repository = "https://github.com/silentvoicesafrica-jpg/benni-teacher-desk"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "benni_teacher_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
